<header>
    <div class="hero">
        <div class="hero-text">
            <h1>Join Our Mailing List!</h1>
            <p>Join and meet thousands of academicians around the globe and stay updated!</p>
            <a href="#form" class="join-button">Click here to JOIN!</a>
        </div>
    </div>
</header>

<section id="form">
    <div class="form-container">
        <h2>Fill the form below:</h2>
        <form>
            <div class="form-group">
                <label for="firstname">First name:</label>
                <input type="text" id="firstname" name="firstname">
            </div>
            <div class="form-group">
                <label for="lastname">Last name:</label>
                <input type="text" id="lastname" name="lastname">
            </div>
            <div class="form-group">
                <label for="email">Email Address:</label>
                <input type="email" id="email" name="email">
            </div>
            <div class="form-group">
                <label for="institution">Institution/Affiliation:</label>
                <input type="text" id="institution" name="institution">
            </div>
            <div class="form-group">
                <label for="academic-institution">Academic Institution:</label>
                <input type="text" id="academic-institution" name="academic-institution">
            </div>
            <button type="submit" class="submit-button">Submit</button>
        </form>
    </div>
</section>
