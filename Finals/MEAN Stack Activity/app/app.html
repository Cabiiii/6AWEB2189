<p>Books Application</p>

<div class="input-group">
  <input id="newBook" placeholder="Title">
  <input id="newAuthor" placeholder="Author">
  <input id="newDesc" placeholder="Description">
  <input id="newPrice" placeholder="Book Price">
  <input id="newCategory" placeholder="Category">
</div>

@if (!isEditMode) {
  <button class="add-btn" (click)="addBook()">Add book</button>
} @else {
  <div style="text-align: center; margin-bottom: 3rem;">
    <button class="add-btn" style="background: #10b981; display: inline-block; margin-right: 10px;" (click) ="updateBook()">Update Book</button>
    <button class="add-btn" style="background: #64748b; display: inline-block;" (click)="cancelEdit()">Cancel</button>
  </div>
}

<hr>

<div class="book-grid">
  @for (book of books; track book.id) {
    <div class="book-card">
      <b>{{ book.title }}</b>
      <span>by {{ book.author }}</span>
      <p>{{ book.desc }}</p>
      <div class="footer">
        <i>{{ book.category }}</i>
        <b>${{ book.price }}</b>
      </div>
      <div style="display: flex; gap: 10px; margin-top: 15px;">
        <button class="edit-btn" style="flex: 1; cursor: pointer; border-radius: 6px; border: 1px solid #38bdf8; color: #38bdf8; background: transparent; padding: 5px;" (click)="editBook(book)">Edit</button>
        <button class="delete-btn" style="flex: 1; margin-top: 0;" (click)="deleteBook(book.id)">Delete</button>
      </div>
    </div>
  } @empty {
    <p class="empty-state">No books available</p>
  }
</div>

<router-outlet />
